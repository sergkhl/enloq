# Composing (MC3): Swipe to Reply, Suggestions, a choice, Undo and Send.
# Generation preserves the draft; a manual choice replaces it and Undo
# restores it (ADR 25 Q8).
# Each run sends its own wording, since the fixture keeps earlier sends. The
# send is a Reply, so the composer and the sent message quote the message it
# answers (ADR 41).
appId: ${APP_ID}
---
- tapOn: "Alex · weekend plans.*"
# Swipe to Reply (ADR 51 Q5): the message swiped to the left.
- swipe:
    from: ".*Can you bring the board game on Saturday\\?.*"
    direction: LEFT
    duration: 400
- assertVisible: "Reply to Alex · weekend plans.*"
- evalScript: ${output.note = 'Bringing the board game ' + new Date().getTime()}
- tapOn: "Message.*"
- inputText: ${output.note}
- tapOn:
    id: "suggestions-button"
- extendedWaitUntil:
    visible: "Acknowledge: Thank you for telling me[.]"
    timeout: 20000
- assertVisible: "${output.note}"
- tapOn: "Acknowledge: Thank you for telling me[.]"
- extendedWaitUntil:
    visible:
      text: "Undo suggestion"
      enabled: true
    timeout: 20000
- assertNotVisible: "${output.note}"
- tapOn: "Undo suggestion"
- assertVisible: "${output.note}"
- tapOn: "Send"
# iOS reads the sent bubble as one label ending in its mark; Android keeps the
# text and the mark apart.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*${output.note}.*(Sent|Read).*"
          timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "${output.note}"
          timeout: 20000
      - extendedWaitUntil:
          visible: "Sent|Read"
          timeout: 20000
- assertVisible: "Reply to Alex · weekend plans.*"
- tapOn: "Back to conversations"
