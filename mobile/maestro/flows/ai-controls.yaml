# AI controls and the Correspondent Profile (ADR 46 CU3) on the fixture's
# authored chats: the profile's Telegram details on "Message details", then
# its AI Menu (ADR 62): AI view and the chat's controls, Remember this chat Off
# by default (ADR 56 Q9) and, on its page, what the person cares about (ADR
# 55); the not-analysed note on "Mixed block", Rewrite earlier messages on
# "Earlier", and "Switches Off", whose five switches are Off (ADR 62 Q14)
# until Emotion turns On (Q8). Retry is left to the web journey and the app's
# tests: a failing engine in the shared fixture would fail the other flows.
# Selectors stay ASCII: without a UTF-8 locale Maestro misreads the rest.
# A chat in the list may sit above where an earlier flow left it, so each
# search looks up first, then down.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: "Message details.*"
    direction: UP
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "Message details.*"
    timeout: 30000
- tapOn: "Message details.*"
# The header's button names the emotion when one shows (ADR 47).
- extendedWaitUntil:
    visible: "Message details, .*open profile"
    timeout: 15000
- tapOn: "Message details, .*open profile"
- extendedWaitUntil:
    visible: "Morgan Lee"
    timeout: 15000
- assertVisible: "@authored_morgan"
- assertVisible: "Authored bio for the journeys."
# The chat's AI controls and panels left the profile (ADR 62 Q4, Q12).
- assertNotVisible: "Remember this chat"
- assertNotVisible: "Cares about"
# Copy chat link left the header for the profile (ADR 47 Q8).
- scrollUntilVisible:
    element: "Copy chat link"
- tapOn: "Copy chat link"
- scrollUntilVisible:
    element: "Chat link copied"
- tapOn: "Back"
# The robot opens the AI Menu: AI view first, then the chat's controls.
- tapOn:
    id: "ai-menu"
- assertVisible:
    id: "ai-view-switch"
    checked: true
# The fixture's authored chats have their switches On but Remember this
# chat, Off by default since ADR 56 (Q9).
- assertVisible:
    id: "ai-emotion-switch"
    checked: true
- assertVisible:
    id: "ai-media-switch"
    checked: true
- assertVisible:
    id: "ai-remember-switch"
    checked: false
# Remember this chat's page holds what the person cares about (Q12).
- tapOn:
    id: "ai-remember"
- extendedWaitUntil:
    visible: "Cares about"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "takeaway-new"
- tapOn:
    id: "takeaway-new"
- inputText: "Prefers calls on Friday"
# The keyboard can cover the counter, so it is read once it closes.
- hideKeyboard
- assertVisible: "23/300 bytes"
# Traits have an Add of their own, named Add trait note.
- scrollUntilVisible:
    element: "Add note"
- tapOn: "Add note"
# Earlier flows' messages may have grown the memory: scroll to the entry.
- scrollUntilVisible:
    element: "Added or edited by you"
    timeout: 30000
- scrollUntilVisible:
    element: "Clear."
- tapOn: "Clear."
- tapOn: "Clear memory"
- scrollUntilVisible:
    element: "Nothing noted yet."
    direction: UP
    timeout: 30000
- tapOn: "Back"
- tapOn: "Back to conversations"
- scrollUntilVisible:
    element: "Mixed block.*"
    direction: UP
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "Mixed block.*"
    timeout: 30000
- tapOn: "Mixed block.*"
- extendedWaitUntil:
    visible: "Not analysed: File contract.pdf"
    timeout: 20000
- tapOn: "Back to conversations"
- scrollUntilVisible:
    element: "Earlier.*"
    direction: UP
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "Earlier.*"
    timeout: 30000
- tapOn: "Earlier.*"
- scrollUntilVisible:
    element: "2 earlier blocks are not rewritten"
    direction: UP
- tapOn: "Rewrite earlier messages"
- extendedWaitUntil:
    notVisible: "2 earlier blocks are not rewritten"
    timeout: 30000
- tapOn: "Back to conversations"
# A chat whose five switches are Off: the robot's outline, its blocks as
# their originals, and Emotion turned On decides its latest block.
- scrollUntilVisible:
    element: "Switches Off.*"
    direction: UP
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "Switches Off.*"
    timeout: 30000
- tapOn: "Switches Off.*"
- extendedWaitUntil:
    visible: "AI Menu, AI off in this chat"
    timeout: 15000
- assertVisible: "Switches Off, open profile"
- tapOn:
    id: "ai-menu"
- assertVisible:
    id: "ai-suggestions-switch"
    checked: false
- assertVisible:
    id: "ai-emotion-switch"
    checked: false
- assertVisible:
    id: "ai-calming-switch"
    checked: false
- assertVisible:
    id: "ai-media-switch"
    checked: false
- assertVisible:
    id: "ai-remember-switch"
    checked: false
- tapOn:
    id: "ai-emotion-switch"
- extendedWaitUntil:
    visible:
      id: "ai-emotion-switch"
      checked: true
    timeout: 15000
- tapOn:
    point: "50%,10%"
- extendedWaitUntil:
    visible: "Switches Off, Mixed or uncertain, open profile"
    timeout: 30000
- assertVisible: "AI Menu, AI on in this chat"
- tapOn: "Back to conversations"
- assertVisible: "Account: Demo account. Switch account"
