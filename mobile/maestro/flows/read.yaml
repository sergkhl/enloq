# Reading (MC2): a conversation in both reading views, switched by AI view in
# the chat's AI Menu (ADR 62 Q1). iOS reads a bubble as one label (header,
# text and footer), so text is matched inside it.
appId: ${APP_ID}
---
- tapOn: "Alex · weekend plans.*"
- extendedWaitUntil:
    visible: ".*Can you bring the board game on Saturday\\?.*"
    timeout: 15000
- runFlow: ../steps/ai-view.yaml
- assertVisible: ".*Can you bring the board game on Saturday\\?.*"
- runFlow: ../steps/ai-view.yaml
- tapOn: "Back to conversations"
- assertVisible: "Account: Demo account. Switch account"
