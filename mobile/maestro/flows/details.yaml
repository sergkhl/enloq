# Message details (ADR 46 CU2) on the fixture's authored "Message details"
# chat: forwarded and imported lines, an edited message's versions, cards,
# Scroll to latest, and the owner's reaction removed and another added from
# the sheet. Selectors stay ASCII: without a UTF-8 locale Maestro misreads
# emoji. Scrolls get a minute, since over the phone's tunnel each swipe and
# check takes seconds, and centre what they find, so nothing tapped next sits
# under the reading bar. The reading view ends on AI, as it began.
# A chat in the list may sit above where an earlier flow left it, so each
# search looks up first, then down.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element: "Message details.*"
    direction: UP
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: "Message details.*"
    timeout: 30000
- tapOn: "Message details.*"
- extendedWaitUntil:
    visible: "AI view"
    timeout: 15000
- tapOn: "AI view"
- extendedWaitUntil:
    visible: "Later message 39"
    timeout: 15000
- scrollUntilVisible:
    element: "Latest wording"
    direction: UP
    timeout: 60000
    centerElement: true
- assertVisible: "Scroll to latest"
- tapOn: "Previous version"
- extendedWaitUntil:
    visible: "Second wording"
    timeout: 15000
- tapOn: "Next version"
- assertVisible: "Latest wording"
- scrollUntilVisible:
    element: "Forwarded from Authored channel.*"
    direction: UP
    timeout: 60000
    centerElement: true
- assertVisible: "Imported"
- scrollUntilVisible:
    element: "React to me"
    direction: DOWN
    timeout: 60000
    centerElement: true
- assertVisible: ".*2, including yours"
- longPressOn: "React to me"
- tapOn: "Remove reaction.*"
- extendedWaitUntil:
    notVisible: ".*including yours"
    timeout: 15000
- longPressOn: "React to me"
- tapOn:
    text: "React .*"
    index: 2
- extendedWaitUntil:
    visible: ".*1, including yours"
    timeout: 15000
- scrollUntilVisible:
    element: "Which day works\\?"
    direction: DOWN
    timeout: 60000
    centerElement: true
- scrollUntilVisible:
    element: "Authored cafe"
    direction: DOWN
    timeout: 60000
    centerElement: true
- scrollUntilVisible:
    element: "Authored Contact"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: "Scroll to latest"
- extendedWaitUntil:
    visible: "Later message 39"
    timeout: 10000
- tapOn: "AI view"
- tapOn: "Back to conversations"
- assertVisible: "Account: Demo account. Switch account"
